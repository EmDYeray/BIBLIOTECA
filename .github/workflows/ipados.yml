name: Biblioteca para iPadOS 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipad:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      VCPKG_REVISION: 74e6536215718009aae747d86d84b78376bf9e09
    steps:
      - uses: actions/checkout@v4

      - name: Verificar Xcode y el SDK para iPad
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk" == 27 || "$sdk" == 27.* ]] || { echo "::error::Se requiere el SDK 27, encontrado $sdk"; exit 1; }
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/OpenGLES.framework"
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Compilar Cairo para arm64 de iPad
        run: |
          build_deps="$RUNNER_TEMP/biblioteca-vcpkg"
          git init "$build_deps"
          git -C "$build_deps" fetch --depth=1 https://github.com/microsoft/vcpkg.git "$VCPKG_REVISION"
          git -C "$build_deps" checkout --detach FETCH_HEAD
          "$build_deps/bootstrap-vcpkg.sh" -disableMetrics
          "$build_deps/vcpkg" install --triplet arm64-ios --host-triplet arm64-osx --x-install-root="$RUNNER_TEMP/biblioteca-deps"

      - name: Compilar la aplicación
        run: |
          unset PKG_CONFIG_PATH
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/biblioteca-deps/arm64-ios/lib/pkgconfig:$RUNNER_TEMP/biblioteca-deps/arm64-ios/share/pkgconfig"
          cmake -S . -B build-ipad -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=27.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build-ipad --config Release --target Biblioteca

      - name: Empaquetar IPA sin firma
        run: |
          app="$(find build-ipad -type d -name Biblioteca.app -print -quit)"
          test -n "$app"
          test -x "$app/Biblioteca"
          lipo -verify_arch arm64 "$app/Biblioteca"
          plutil -lint "$app/Info.plist"
          test -s "$app/assets/covers/europa.png"
          test -s "$app/assets/popups/cohete.obj"
          test -s "$app/assets/popups/apolo-muestras.obj"
          test -s "$app/assets/shaders/scene.vert"
          test -s "$app/assets/fonts/Barlow-Regular.ttf"
          mkdir -p "$RUNNER_TEMP/biblioteca-ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/biblioteca-ipa/Payload/Biblioteca.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/biblioteca-ipa/Payload" dist/Biblioteca-iPadOS27-sin-firma.ipa
          unzip -tq dist/Biblioteca-iPadOS27-sin-firma.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-iPadOS27-sin-firma
          path: dist/*.ipa
          if-no-files-found: error
