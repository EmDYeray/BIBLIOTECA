name: Windows native build and verification

on:
  workflow_dispatch:
  push:
    branches: [main, windows-build]
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "src/**"
      - "assets/**"
      - "Makefile.windows"
      - "packaging/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install UCRT64 C++ dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-nsis
            zip
            unzip

      - name: Compile and run headless geometry tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -f Makefile.windows -j2
          make -f Makefile.windows test
          ./biblioteca.exe --help

      - name: Assemble portable application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p windows-stage
          cp biblioteca.exe windows-stage/
          cp -R assets windows-stage/
          cp LICENSE ASSETS_OPEN.md WINDOWS.md windows-stage/
          printf 'Git commit: %s\nTarget: Windows x86-64 (MSYS2 UCRT64)\n' "$GITHUB_SHA" > windows-stage/BUILD_INFO.txt
          # Copy the complete recursive UCRT64 dependency closure, not only direct DLL imports.
          ldd biblioteca.exe | awk '$3 ~ /^\/ucrt64\/bin\// { print $3 }' | sort -u | while IFS= read -r dll; do
            cp "$dll" windows-stage/
          done
          test -s windows-stage/biblioteca.exe
          test -s windows-stage/LICENSE
          test -s windows-stage/BUILD_INFO.txt
          test -s windows-stage/assets/shaders/scene.vert
          test -s windows-stage/assets/shaders/scene.frag
          test -s windows-stage/assets/fonts/Barlow-Regular.ttf
          test -s windows-stage/assets/popups/cohete.obj
          test -f windows-stage/SDL2.dll
          test -f windows-stage/libcairo-2.dll
          # Keep Fontconfig configuration in the portable build.
          if [ -d /ucrt64/etc/fonts ]; then
            mkdir -p windows-stage/etc
            cp -R /ucrt64/etc/fonts windows-stage/etc/
          fi

      - name: Run packaged executable with system-only Windows PATH
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          start "" /wait "%CD%\windows-stage\biblioteca.exe" --self-test
          if errorlevel 1 exit /b 1
          start "" /wait "%CD%\windows-stage\biblioteca.exe" --help
          if errorlevel 1 exit /b 1

      - name: Attempt native graphical rendering and require proof frames
        shell: cmd
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          start "" /wait "%CD%\windows-stage\biblioteca.exe" --desktop-check windows-render
          if exist "%TEMP%\Biblioteca3D-error.log" type "%TEMP%\Biblioteca3D-error.log"
          if errorlevel 1 exit /b 1
          if not exist windows-render\*.png exit /b 2
          echo Render succeeded and generated PNG proof frames

      - name: Create Windows portable ZIP
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd windows-stage
          zip -q -r ../dist/Biblioteca-3D-Windows-x64.zip .
          cd ..
          unzip -t dist/Biblioteca-3D-Windows-x64.zip
          test -s dist/Biblioteca-3D-Windows-x64.zip
          sha256sum dist/Biblioteca-3D-Windows-x64.zip > dist/SHA256SUMS.txt

      - name: Build optional single-file launcher
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -euo pipefail
          makensis packaging/windows-portable.nsi
          test -s dist/Biblioteca-Windows.exe

      - name: Install Mesa software OpenGL for CI-only rendering
        shell: msys2 {0}
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -euo pipefail
          pacman --noconfirm --needed -S mingw-w64-ucrt-x86_64-mesa
          mkdir -p render-stage
          cp -R windows-stage/. render-stage/
          cp /ucrt64/bin/opengl32.dll /ucrt64/bin/libgallium_wgl.dll render-stage/
          ldd /ucrt64/bin/libgallium_wgl.dll | awk '$3 ~ /^\/ucrt64\/bin\// { print $3 }' | sort -u | while IFS= read -r dll; do
            cp -n "$dll" render-stage/
          done
          test -s render-stage/opengl32.dll
          test -s render-stage/libgallium_wgl.dll

      - name: Render proof frames with Mesa llvmpipe on Windows
        shell: cmd
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set "GALLIUM_DRIVER=llvmpipe"
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          if not exist "render-stage\opengl32.dll" exit /b 3
          start "" /wait "%CD%\render-stage\biblioteca.exe" --desktop-check windows-render-mesa
          if not exist windows-render-mesa\*.png exit /b 2
          echo Verified actual OpenGL renderer with Windows Mesa llvmpipe

      - name: Upload Mesa Windows render proof frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows-Mesa-frames
          path: windows-render-mesa/*.png
          if-no-files-found: warn

      - name: Publish test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows-test-build
          path: |
            dist/Biblioteca-3D-Windows-x64.zip
            dist/Biblioteca-Windows.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload native Windows render frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows-render-diagnostics
          path: windows-render/*.png
          if-no-files-found: warn

      - name: Collect Windows error diagnostics
        if: always()
        shell: cmd
        run: |
          if exist "%TEMP%\Biblioteca3D-error.log" copy "%TEMP%\Biblioteca3D-error.log" "Biblioteca3D-error.log"

      - name: Upload native startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows-error-diagnostics
          path: Biblioteca3D-error.log
          if-no-files-found: warn

      - name: Report Windows verification evidence
        if: always()
        shell: msys2 {0}
        run: |
          {
            echo "# Windows build verification"
            echo
            echo "Native Win32 C++ build, geometry self-tests, portable deployment and ZIP integrity are tested by the steps above."
            if compgen -G "windows-render/*.png" > /dev/null || compgen -G "windows-render-mesa/*.png" > /dev/null; then
              echo "OpenGL rendering: PNG proof frames generated on the runner."
            else
              echo "OpenGL rendering: **not verified on this runner** (no proof frames)."
              echo "A physical Windows 11 PC with an OpenGL 3.3 graphics driver must complete the 3D acceptance checklist."
            fi
            echo
            echo "Download the **Biblioteca-Windows-test-build** artifact and use the portable ZIP."
          } >> "$GITHUB_STEP_SUMMARY"
