name: English story localization draft

on:
  push:
    branches: [English, english-content]
    paths:
      - "tools/localize_cpp_prose.py"
      - "src/**"
      - ".github/workflows/english-content.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout English draft
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline translation engine
        run: python -m pip install "argostranslate>=1.11,<1.12"
      - name: Translate story prose and chapter titles
        run: python tools/localize_cpp_prose.py
      - name: Validate source text
        run: git diff --check
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsdl2-dev libcairo2-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Compile translated C++ sources
        run: make -j2
      - name: Run regression checks (diagnostic)
        run: make test
      - name: Commit English draft to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stories.cpp src/child_text.cpp src/adult_books.cpp src/imported_books.cpp src/technical_notes.cpp
          if git diff --cached --quiet; then
            echo "Nothing to translate"
          else
            git commit -m "Localize narrative content in English (draft)"
            git push origin HEAD:English
          fi
