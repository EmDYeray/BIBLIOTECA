name: English content regression

on:
  push:
    branches: [English]
    paths:
      - "src/**"
      - ".github/workflows/english-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-english:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout localized source
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsdl2-dev libcairo2-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Compile translated C++ source
        run: make -j2
      - name: Verify geometry, navigation and translated text limits
        run: make test
